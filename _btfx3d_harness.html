function toast(m){console.log('[toast]',m);}
var EC = { designs: [] };
const MOCK = {

  w:26, h:16, cap:50, zone:4, acts_max:6, acts_left:6, my_side:'attacker', my_fid:'me',
  attacker:'me', attacker_name:'Микустан', defender:'foe', defender_name:'Тетославия',
  side_to_move:'attacker', my_turn:true, turn_no:1, log:[],
  units:[
    {id:'a1',side:'attacker',mine:true,name:'Стрелок',cls:'battleship',x:6,y:8,facing:0,
     hp:900,max_hp:900,shield:200,max_shield:200,armor:10,speed:2,rng:12,dmg:120,tp:12,fire_cost:2,
     wpn:[{k:'kinetic',bat:'A',dmg:420,rng:8,shots:3},{k:'energy',bat:'B',dmg:600,rng:12,shots:1},
          {k:'missile',bat:'C',dmg:900,rng:14,shots:2},{k:'repair',dmg:120,rng:5,shots:1}],

    {id:'a2',side:'attacker',mine:true,name:'Ведомый',cls:'frigate',x:5,y:11,facing:0,

     wpn:[{k:'energy',dmg:800,rng:12,shots:1}]},
    {id:'d2',side:'defender',mine:false,name:'Конвой',cls:'cruiser',x:18,y:10,facing:3,
     hp:640,max_hp:900,shield:60,max_shield:150,armor:9,speed:2,rng:10,dmg:90,
     wpn:[{k:'missile',dmg:500,rng:10,shots:2}]},
    {id:'d3',side:'defender',mine:false,name:'Эскорт',cls:'corvette',x:15,y:5,facing:3,
     hp:300,max_hp:500,shield:0,max_shield:0,armor:6,speed:4,rng:6,dmg:40,
     wpn:[{k:'kinetic',dmg:220,rng:6,shots:4}]},
  ],
  terrain:[
    {x:10,y:3,t:'ast'},{x:11,y:4,t:'ast'},{x:10,y:5,t:'ast'},{x:12,y:3,t:'ast'},{x:9,y:4,t:'ast'},
    {x:12,y:12,t:'neb'},{x:13,y:12,t:'neb'},{x:12,y:13,t:'neb'},{x:11,y:13,t:'neb'},

<script src="constructors.js"></script>
<script src="battle_board.js"></script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
  window.THREE = THREE;
  window.dispatchEvent(new Event('three-ready'));
</script>
<script src="battle_gl.js"></script>
<script>
function boot(){
  BB.st = MOCK; BB.R = 34;
  const cv = document.getElementById('gl');
  BB.vw = cv.clientWidth || 1200; BB.vh = cv.clientHeight || 700;
  BB.terr = new Map();
  (MOCK.terrain||[]).forEach(e => BB.terr.set(e.x+':'+e.y, e.t));
  if (!bgInit(cv)) return;
  bgCamHome(); bgRefresh();
}
// Все почерки: оружие бьёт по «Мишени», модули — по ней же или вокруг себя.
const SHOW = [
  ['Кинетика · очередь',      'w', 'kinetic'],
  ['Лазер · луч',             'w', 'energy'],
  ['Ракеты · дуга и дым',     'w', 'missile'],
  ['Нано-рой · ремонт',       'w', 'repair'],
  ['Бортовой залп',           'm', 'broadside'],
  ['Ракеты «Шквал»',          'm', 'storm'],
  ['Торпеда «Голиаф»',        'm', 'torpedo'],
  ['Ядерная ракета',          'm', 'nuke'],
  ['Плазменный таран',        'm', 'ram'],
  ['Тяговый луч',             'm', 'tractor'],
  ['Торпеда-иссушитель',      'm', 'drain'],
  ['Ракета-подавитель',       'm', 'disrupt'],
  ['Прыжок',                  'm', 'blink'],
  ['Импульс: адские лазеры',  'm', 'hell'],
  ['Импульс: стазис',         'm', 'stasis'],
  ['Импульс: брони',          'm', 'aboost'],
];
function fire(kind, key) {
  BB.anim.fx.length = 0;
  const sel = MOCK.units.find(u=>u.id==='a1'), tgt = MOCK.units.find(u=>u.id==='d1');
  const t0 = performance.now();
  if (kind === 'w') {
    const g = sel.wpn.find(w=>w.k===key), prof = bbFxWProf(key, g.shots);
    const a = bbHexCenter(sel.x, sel.y), b = bbHexCenter(tgt.x, tgt.y);
    const col = key==='repair'?'120,255,190':(key==='missile'?'255,150,60':'90,220,240');
    const at = bbFxVolley(a, b, prof, t0, col);
    bbFxImpact(b.px, b.py, at, prof.impact, key==='missile'?'255,150,60':col, prof);
  } else {
    const prof = bbFxMProf(key), aura = prof.aura || prof.self;
    bbModFx(sel, key, aura?null:tgt.x, aura?null:tgt.y);
  }
  bgKick();
}
const ctl = document.getElementById('ctl');
SHOW.forEach(([name, kind, key]) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => fire(kind, key);
  ctl.appendChild(b);
});
if (window.THREE) boot(); else window.addEventListener('three-ready', boot);
</script>
</body></html>
