async function dbGet(t, q = '') {
  if (t === 'chat_stickers') return STICKERS;

  return [];
}
async function dbPost(t, b) {
  if (t === 'rpc/chat_my_rooms') return ROOMS;
  if (t === 'chat_messages') { const row = { id: ++NEXT, author_id: 'me', created_at: new Date().toISOString(), ...b }; MSG.push(row); return [row]; }
  if (t === 'chat_reactions') { RX.push({ msg_id: b.msg_id, emoji: b.emoji, author_id: 'me', name: b.name }); return [b]; }
  return [];
}
async function dbPatch(t, q, b) {
  const id = +String(q).split('eq.')[1];
  const m = MSG.find(x => x.id === id); if (!m) return [];
  Object.assign(m, b, b.body ? { ed: new Date().toISOString() } : {}, b.del ? { body: 'сообщение удалено' } : {});

}
