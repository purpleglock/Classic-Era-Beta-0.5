<!doctype html><meta charset="utf-8"><title>orbital gen probe</title>
<body style="background:#05060b;color:#cfe;font:13px system-ui">
<canvas id="c" width="900" height="560"></canvas>
<pre id="log"></pre>
<script src="hull_gen.js"></script>
<script src="orbital_gen.js?v=2"></script>
<script>
const log=m=>document.getElementById('log').textContent+=m+'\n';
const MIN=12;
const KINDS=['sat','obs','cargo','dock','battery','base'];
const NAMES={sat:'спутник связи',obs:'обсерватория',cargo:'грузовой терминал',dock:'верфь-стапель',battery:'оборонный спутник',base:'звёздная база'};
function load(kind,col){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(OG.svg(kind,{tint:OG.tintOf(col)},128));});}
function tile(im,h){h=Math.round(h/4)*4;if(h<MIN)return null;const w=Math.max(2,Math.round(h*im.naturalWidth/im.naturalHeight));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(im,0,0,w,h);return cv;}
const COL=[120,200,235];
const ctx=document.getElementById('c').getContext('2d');
(async()=>{
  ctx.fillStyle='#05060b';ctx.fillRect(0,0,900,560);
  const ims={};for(const k of KINDS)ims[k]=await load(k,COL);
  if(KINDS.some(k=>!ims[k])){log('НЕ ЗАГРУЗИЛОСЬ');return;}
  // ряд 1: крупно (×4) — что за конструкция вообще
  ctx.fillStyle='#8aa';ctx.textAlign='center';
  KINDS.forEach((k,i)=>{const x=75+i*150;ctx.drawImage(ims[k],x-48,20,96,96);ctx.fillText(NAMES[k],x,134);});
  // ряд 2: боевые размеры тайлов 12 / 20 / 34
  [12,20,34].forEach((h,row)=>{
    KINDS.forEach((k,i)=>{
      const t=tile(ims[k],h),x=75+i*150,y=180+row*70;
      if(t)ctx.drawImage(t,x-t.width/2,y-t.height/2);
      else{ctx.fillStyle='#8aa';ctx.fillRect(x-1.4,y-1.4,2.8,2.8);}
    });
    ctx.fillStyle='#8aa';ctx.textAlign='left';ctx.fillText('h='+h,10,183+row*70);
  });
  // ряд 3: планета со своей орбитальной группировкой — как на карте
  const px=450,py=450,sz=26,TILT=.6;
  const g=ctx.createRadialGradient(px-sz*.4,py-sz*.4,0,px,py,sz);
  g.addColorStop(0,'#6ea3c8');g.addColorStop(.6,'#2b5375');g.addColorStop(1,'#0a1420');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,sz,0,6.3);ctx.fill();
  const at=(aa,R)=>({x:px+Math.cos(aa)*R,y:py+Math.sin(aa)*R*TILT,ang:Math.atan2(Math.cos(aa)*TILT,-Math.sin(aa))});
  // орбитальные нити
  ctx.strokeStyle='rgba(150,190,255,.18)';ctx.lineWidth=1;
  [sz*1.45,sz*2.15].forEach(R=>{ctx.beginPath();ctx.ellipse(px,py,R,R*TILT,0,0,6.3);ctx.stroke();});
  // спутники
  const st=tile(ims.sat,Math.max(10,Math.min(20,sz*.75)));
  for(let k=0;k<3;k++){const P=at(k*2.09+.4,sz*1.45);ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.ang);ctx.drawImage(st,-st.width/2,-st.height/2);ctx.restore();}
  // структуры на дальней орбите
  const rig=[['base',1.3],['dock',1.15],['obs',1.0],['cargo',1.0]];
  rig.forEach(([k,hk],i)=>{const P=at(i*(6.2832/rig.length)+.9,sz*2.15);const t=tile(ims[k],Math.max(12,Math.min(34,sz*hk)));
    ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.ang);ctx.drawImage(t,-t.width/2,-t.height/2);ctx.restore();});
  ctx.fillStyle='#8aa';ctx.textAlign='center';ctx.fillText('планета sz=26 со своей группировкой (как на карте)',450,545);
  KINDS.forEach(k=>{const t=tile(ims[k],20);log(k+': исходник '+ims[k].naturalWidth+'x'+ims[k].naturalHeight+', тайл20 '+t.width+'x'+t.height);});
})();
</script>
