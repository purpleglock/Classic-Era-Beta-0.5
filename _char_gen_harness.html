<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гримёрная · ядро: лицо и глаза</title>
<style>
  :root{ --b0:#070a0e; --b1:#0c1117; --b2:#121a23; --ln:#1d2733; --tx:#cad4df; --dim:#6a7684; --ac:#5fd0c0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--b0);color:var(--tx);font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--ln);background:var(--b1)}
  header h1{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
  header .sub{color:var(--dim);font-size:10px;font-family:ui-monospace,Consolas,monospace}
  nav{margin-left:auto;display:flex;gap:4px}
  nav button{background:transparent;border:1px solid var(--ln);color:var(--dim);padding:6px 14px;border-radius:2px;cursor:pointer;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  nav button.on{color:var(--ac);border-color:var(--ac);background:#0f1b1d}
  .wrap{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 45px)}
  .panel{border-right:1px solid var(--ln);background:var(--b1);overflow-y:auto;padding-bottom:24px}
  .stage{overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
  details{border-bottom:1px solid var(--ln)}
  details>summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:'▸ ';color:var(--ac)}
  details[open]>summary::before{content:'▾ '}
  .body{padding:4px 14px 14px}
  label{display:block;margin-bottom:10px}
  label>span{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:4px}
  label>span b{color:var(--tx);font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:500}
  select{width:100%;background:var(--b2);border:1px solid var(--ln);color:var(--tx);padding:6px;border-radius:2px;font-size:12px}
  input[type=range]{width:100%;accent-color:var(--ac);height:16px}
  .seg{display:flex;gap:3px}
  .seg button{flex:1;background:var(--b2);border:1px solid var(--ln);color:var(--dim);padding:6px 2px;font-size:11px;border-radius:2px;cursor:pointer}
  .seg button.on{border-color:var(--ac);color:var(--ac)}
  .btn{background:var(--b2);border:1px solid var(--ln);color:var(--tx);padding:9px 12px;border-radius:2px;cursor:pointer;font-size:11px;width:100%;margin-bottom:6px}
  .btn:hover{border-color:var(--ac);color:var(--ac)}
  .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .swatches i{width:22px;height:22px;border-radius:2px;border:1px solid var(--ln);cursor:pointer}
  .swatches i.on{box-shadow:0 0 0 1px #fff inset;border-color:#fff}
  .card{border:1px solid var(--ln);background:#0a0e14;overflow:hidden;position:relative;line-height:0}
  .card .cg-svg{display:block;width:100%;height:auto}
  .solo{width:min(440px,84vw)}
  /* крупный план: тот же SVG, обрезанный по глазам — деталь видно сразу */
  .zoom{width:min(440px,84vw);height:260px;overflow:hidden;position:relative;border:1px solid var(--ln);background:#0a0e14}
  /* origin — ровно на линии глаз: eyeY = (96 + 0.66·330)/560 кадра */
  /* origin — на линии глаз, затем сдвиг, чтобы она села в центр окна */
  .zoom>div{position:absolute;left:0;top:0;width:440px;transform:translateY(-140px) scale(2.6);transform-origin:220px 270px}
  .zoom>div .cg-svg{width:440px;display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
  .tag{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.72);border:1px solid var(--ln);padding:2px 6px;font-size:9px;font-family:ui-monospace,monospace;color:var(--dim);line-height:1.4}
  .note{color:var(--dim);font-size:11px;line-height:1.75;max-width:760px}
  .note b{color:var(--tx);font-weight:500}
  .todo{color:var(--dim);font-size:11px;font-family:ui-monospace,Consolas,monospace;line-height:1.9;max-width:760px;border:1px solid var(--ln);padding:12px 14px}
  .todo s{color:#3f4a56}
</style>
</head>
<body>
<header>
  <h1>Гримёрная</h1>
  <span class="sub">char_gen v4 · ядро: форма лица + глаза</span>
  <nav>
    <button id="t-solo" class="on" onclick="tab('solo')">Портрет</button>
    <button id="t-grid" onclick="tab('grid')">Расы</button>
    <button id="t-roll" onclick="tab('roll')">Разброс</button>
  </nav>
</header>

<div class="wrap">
  <div class="panel" id="ctl"></div>
  <div class="stage" id="stage"></div>
</div>

<script>document.write('<scr'+'ipt src="char_gen.js?b='+Date.now()+'"><\/scr'+'ipt>')</script>
<script>
const P = CG.defaults('Гуманоиды','жен.', 20260804);
let TAB = 'solo';

const GROUPS = [
  ['Форма лица', true, [['Челюсть (овал → клин)','jaw'], ['Скулы','cheek'], ['Возраст','age']]],
  ['Глаза', true, [['Размер','eyeSize'], ['Расстановка','eyeGap'], ['Наклон разреза','eyeTilt']]],
  ['Кожа', false, [['Тон','hue'], ['Насыщенность','sat'], ['Светлота','lit']]],
];

function slider(t,k){
  return `<label><span>${t} <b>${P[k]}</b></span><input type="range" min="0" max="100" value="${P[k]}"
     oninput="P['${k}']=+this.value;draw();this.parentNode.querySelector('b').textContent=this.value"></label>`;
}
function ctl(){
  const irises = (CG.RACES[P.race]||{}).iris || [];
  document.getElementById('ctl').innerHTML = `
  <details open><summary>Личность</summary><div class="body">
    <label><span>Раса</span><select onchange="P.race=this.value;reroll(P.seed)">
      ${CG.RACE_LIST.map(r=>`<option ${r===P.race?'selected':''}>${r}</option>`).join('')}</select></label>
    <label><span>Пол</span><div class="seg">${['муж.','жен.','агендер'].map(g=>
      `<button class="${g===P.gender?'on':''}" onclick="P.gender='${g}';reroll(P.seed)">${g}</button>`).join('')}</div></label>
    <label><span>Радужка</span><div class="swatches">${irises.map(c=>
      `<i class="${c===P.iris?'on':''}" style="background:${c}" onclick="P.iris='${c}';draw();ctl()"></i>`).join('')}</div></label>
  </div></details>
  ${GROUPS.map(([t,open,items])=>`<details ${open?'open':''}><summary>${t}</summary>
     <div class="body">${items.map(([n,k])=>slider(n,k)).join('')}</div></details>`).join('')}
  <div class="body" style="padding-top:14px">
    <button class="btn" onclick="reroll()">↻ Новый оперативник</button>
    <div style="color:var(--dim);font-size:10px;font-family:ui-monospace,monospace;margin-top:8px">seed ${P.seed}</div>
  </div>`;
}
function reroll(seed){
  const s = seed==null ? (Math.random()*1e9|0) : seed;
  Object.assign(P, CG.defaults(P.race, P.gender, s));
  ctl(); draw();
}
function tab(t){ TAB=t; ['solo','grid','roll'].forEach(x=>document.getElementById('t-'+x).classList.toggle('on',x===t)); draw(); }
const card=(p,tag)=>`<div class="card">${CG.render(p)}${tag?`<div class="tag">${tag}</div>`:''}</div>`;

function draw(){
  const st = document.getElementById('stage');
  if (TAB==='solo'){
    const svg = CG.render(P);
    st.innerHTML = `<div class="card solo">${svg}</div>
      <div class="zoom"><div>${svg}</div></div>
      <div class="todo">НАРИСОВАНО: форма лица · глаза<br>
        <s>брови · нос · рот · уши · волосы · шея · плечи · метки рас · снаряжение</s><br>
        Детали возвращаются по одной, каждая проверяется в крупном плане выше.</div>`;
    return;
  }
  if (TAB==='grid'){
    st.innerHTML = `<div class="grid">${CG.RACE_LIST.map(r=>
      card(CG.defaults(r, P.gender, P.seed), r.split(' ')[0])).join('')}</div>
    <div class="note">Пока раса влияет только на <b>пропорции лица, цвет кожи, радужку и тип зрачка</b>.
      Уши, метки и гребни вернутся отдельными деталями.</div>`;
    return;
  }
  st.innerHTML = `<div class="grid">${[...Array(12)].map((_,i)=>{
    const s=(P.seed+i*7919)>>>0;
    return card(CG.defaults(P.race,P.gender,s),'seed '+s.toString(36));
  }).join('')}</div>
  <div class="note">Двенадцать сидов подряд без подкрутки — контроль разброса.</div>`;
}
ctl(); draw();
</script>
</body>
</html>
