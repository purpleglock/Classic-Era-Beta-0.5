<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>cens harness</title>
<link rel="stylesheet" href="css/index.css?v=harness">
<style>body{background:#0a0d11;padding:40px;display:flex;gap:40px;align-items:flex-start}
.contrib-grid{display:grid;grid-template-columns:repeat(2,150px);gap:14px}
.mo-contrib-panel{position:relative;display:flex;gap:20px;width:520px;padding:20px;background:#0e141b;border:1px solid #223}
.cmp-left{width:200px;display:flex;flex-direction:column;align-items:center;gap:10px}.cmp-right{flex:1}
</style></head><body>
<div class="contrib-grid">
  <div class="contrib-card contrib-censored"><div class="contrib-scan"></div><div class="contrib-card-top"><div class="contrib-av-wrap"><div class="contrib-av"><span style="font-size:20px">SE</span></div><div class="contrib-av-ring"></div><div class="contrib-rank-num">2</div></div><div class="contrib-card-info"><div class="contrib-name">SETIS241</div></div></div><div class="contrib-card-bottom"><div class="contrib-stat-bar"><div class="contrib-stat-fill" style="width:18%"></div></div><div class="contrib-cnt">18&nbsp;СТР</div></div><div class="cens-layer"><i></i><i></i><i></i></div></div>
  <div class="contrib-card"><div class="contrib-scan"></div><div class="contrib-card-top"><div class="contrib-av-wrap"><div class="contrib-av"><span style="font-size:20px">AL</span></div><div class="contrib-av-ring"></div><div class="contrib-rank-num">3</div></div><div class="contrib-card-info"><div class="contrib-name">ALTAIR</div></div></div><div class="contrib-card-bottom"><div class="contrib-stat-bar"><div class="contrib-stat-fill" style="width:9%"></div></div><div class="contrib-cnt">9&nbsp;СТР</div></div></div>
</div>

<div class="mo mo-contrib-panel cmp-censored">
  <button class="xb cmp-close">✕</button>
  <div class="cmp-left">
    <div class="cmp-av-zone"><div class="cmp-av-frame"><div class="cmp-av-corner cmp-av-corner--tl"></div><div class="cmp-av-corner cmp-av-corner--tr"></div><div class="cmp-av-corner cmp-av-corner--bl"></div><div class="cmp-av-corner cmp-av-corner--br"></div><div class="contrib-mo-av"><span>SE</span></div></div><div class="cmp-scanbeam"></div></div>
    <div class="cmp-id"><div class="cmp-label">◈ ИДЕНТИФИКАТОР</div><div class="contrib-mo-name">SETIS241</div><div class="contrib-mo-email">SUPERADMIN</div></div>
    <div class="cmp-stat-block"><div class="cmp-stat-item"><span class="cmp-stat-val">18</span><span class="cmp-stat-key">СТРАНИЦ</span></div></div>
    <button class="cmp-edit-btn">✎ РЕДАКТИРОВАТЬ ПРОФИЛЬ</button>
  </div>
  <div class="cmp-right">
    <div class="cmp-right-hdr"><span class="cmp-right-title">СТРАНИЦЫ</span><span class="cmp-right-line"></span></div>
    <div class="cmp-pages-list"><div class="contrib-pg-row">Хроники Империи</div><div class="contrib-pg-row">Флот Пан-Колоний</div></div>
  </div>
  <div class="cens-layer"><i></i><i></i><i></i></div>
</div>
</body></html>
