function frame(){const t=performance.now()/1000;cells.forEach(c=>paint(c,t));requestAnimationFrame(frame);}
function measure(){const t=12.0;cells.forEach(c=>paint(c,t));
  const cnt=(g,x,y,w,h)=>{const d=g.getImageData(x,y,w,h).data;let n=0;
    for(let i=0;i<d.length;i+=4){if(d[i]+d[i+1]+d[i+2]>90)n++;}return n;};
  const w=cells[0].g,n=cells[1].g;
  document.getElementById('num').textContent=
    'полоса нимба (x 51…329, y 57…131), непустых пикселей:
   было '+cnt(w,51,57,278,74)+
    '
   стало '+cnt(n,51,57,278,74)+'
   разница '+(cnt(w,51,57,278,74)-cnt(n,51,57,278,74))+
    '

весь спрайт целиком:
   было '+cnt(w,0,0,380,380)+'
   стало '+cnt(n,0,0,380,380)+
    '
   разница '+(cnt(w,0,0,380,380)-cnt(n,0,0,380,380));
  frame();}
setTimeout(measure,300);
</script>
